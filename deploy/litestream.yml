# Copy to /etc/fibre-observer/litestream.yml and enable fibre-litestream.service
# (deploy/systemd/fibre-litestream.service), which runs
# `litestream replicate -config /etc/fibre-observer/litestream.yml`.
#
# This replicates the DERIVED database only. The JSONL files in the same
# directory are the record the database is rebuilt from, and litestream does
# not copy them: back them up separately (rsync/restic) or accept that a lost
# disk costs the raw evidence. Restoring: stop fibre-collector AND fibre-api
# (both hold the WAL) before `litestream restore`.
dbs:
  - path: /var/lib/fibre-observer/data/observer.db
    replicas:
      - type: s3
        bucket: fibre-observer-backup
        path: observer.db
        endpoint: https://<account>.r2.cloudflarestorage.com
        region: auto
        # access keys via LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
        sync-interval: 1s
        retention: 72h
        snapshot-interval: 24h

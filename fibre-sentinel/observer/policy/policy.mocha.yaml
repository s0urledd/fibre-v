# Probe load policy for mocha-5 at Fibre launch. Differs from policy.example.yaml
# (the mainnet November model) only in the capacity model and the hourly
# fraction; see docs/research/R4-probe-etiquette.md section 6a.
# Every per-validator number is PER VANTAGE; run at most three vantages.

capacity_model:
  floor_rows: 148                 # smallest assignment (MinRowsPerValidator)
  floor_validator_bps: 53000000   # 53 Mbps: floor validator's launch ingress incl. 20% allowance, Celestia "Fibre requirements" sheet, 14 Sep 2026
  scale_with_rows: true           # cap(rows) = cap(148) * rows / 148

caps:
  per_validator:
    requests_per_minute: 30
    min_request_spacing: 2s
    bytes_per_hour_fraction: 0.002    # 0.2% of the launch ingress -> 47.7 MB/h at 148 rows (~9 floor shards of a 128 MiB blob)
    bytes_per_day_fraction: 0.0015    # -> 859 MB/day at 148 rows
  global:
    bytes_per_hour: 53687091200       # 50 GiB; binds first in the 128 MiB/min scenario (p ~ 0.4)
    bytes_per_day: 644245094400       # 600 GiB

sampling:
  master_secret_file: ""            # empty: a process-local random secret (fine for devnet; set a path for a public vantage)
  projection_lookback: 1h
  always_probe: []                  # promise hashes exempt from sampling, e.g. a blob under dispute

backoff:
  skip_download_after: 3            # consecutive transport failures before DownloadShard is skipped
  skip_window: 20m
